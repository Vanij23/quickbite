name: ci-cd

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/**"]
  pull_request:
    branches: [main]
    paths: ["app/**"]

permissions:
  id-token: write   # needed for AWS OIDC
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: quickbite
  ECS_CLUSTER: quickbite-cluster
  ECS_SERVICE: quickbite-service
  TASK_FAMILY: quickbite-task
  STACK_NAME: quickbite

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        working-directory: app
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        working-directory: app
        run: pytest -v

  build-and-deploy:
    name: Build image and deploy to ECS
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        working-directory: app
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}"
          docker build -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          echo "image=$IMAGE:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Show image scan result (non-blocking)
        continue-on-error: true
        run: |
          aws ecr wait image-scan-complete --repository-name "$ECR_REPOSITORY" --image-id imageTag="${GITHUB_SHA}"
          aws ecr describe-image-scan-findings --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="${GITHUB_SHA}" --query 'imageScanFindings.findingSeverityCounts'

      - name: Register new task definition revision
        id: taskdef
        run: |
          TD=$(aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query taskDefinition)
          NEW=$(echo "$TD" | jq \
            --arg IMG "${{ steps.build.outputs.image }}" --arg VER "${GITHUB_SHA}" '
            del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
            | .containerDefinitions[0].image = $IMG
            | .containerDefinitions[0].environment |= map(if .name=="APP_VERSION" then .value=$VER else . end)')
          ARN=$(aws ecs register-task-definition --cli-input-json "$NEW" \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS and wait for stability
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Verify the running application
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='AppUrl'].OutputValue" --output text)
          echo "Checking $URL"
          for i in $(seq 1 12); do
            RUNNING=$(curl -fsS "$URL/version" | jq -r .version || true)
            echo "attempt $i: running version = $RUNNING"
            if [ "$RUNNING" = "${GITHUB_SHA}" ]; then
              curl -fsS "$URL/health"
              echo "Deployment verified"
              exit 0
            fi
            sleep 10
          done
          echo "New version did not become live in time" && exit 1
